# Configuracio de l'InputToggle. Es llegeix en arrencar:
# si canvies res, surt del programa (menu de la safata) i torna a obrir-lo.

# Identificador EDID del monitor. PHLC29F = Philips Evnia 34M2C8600.
monitor=PHLC29F

# Codis del VCP 0x60 d'aquest monitor, trets del propi EvniaServe:
#   15 = DisplayPort 1     17 = HDMI 1     18 = HDMI 2     21 = USB-C 1
entrada_a=15
nom_a=Aquest PC (DisplayPort)
entrada_b=18
nom_b=L'altre aparell (HDMI 2)

# Evnia Smart Size: 1 = 1:1 (34" al PC), 8 = zoom (recorda el preset de 27").
escala_a=1
escala_b=8
# Un senyal per sobre de 125 Hz es del PC (175 Hz); la Switch arriba a 120 Hz.
pc_per_sobre_hz=125

# Dreceres que fan el toggle d'entrada, separades per comes.
#   Ctrl+Alt+Shift+F10 -> el desti de Fn+Enter (assignat des de G HUB / KEYCONTROL)
dreceres=Ctrl+Alt+Shift+F10

# Dreceres que silencien i desilencien els altaveus del monitor (VCP 0x8D).
# Assigna-hi una altra tecla de la capa Fn des de G HUB, igual que amb l'altra.
dreceres_silenci=Ctrl+Alt+Shift+F11
silenci_valor=1
so_valor=2

# Globus d'avis a la safata quan canvia l'entrada. En silenci: l'unic senyal
# es el color de la icona (blau = aquest PC, taronja = l'altre aparell).
notificacions=no
